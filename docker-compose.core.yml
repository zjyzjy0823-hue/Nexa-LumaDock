services:
  postgres:
    image: postgres:16
    env_file: .env.core
    volumes:
      - nexa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

  nexa-core:
    build:
      context: .
      dockerfile: backend/Dockerfile.core
    env_file: .env.core
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  nexa-postgres-data:
