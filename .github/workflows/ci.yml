name: CI
on: [push, pull_request]
jobs:
  validation-impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_validation_tooling.py
      - name: Record cumulative validation plan
        run: |
          python scripts/detect-change-impact.py --base f59b60de688a5a5b35471e2a47a4a31dd1baaabf --json > validation-plan.json
          python scripts/detect-change-impact.py --base f59b60de688a5a5b35471e2a47a4a31dd1baaabf >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: validation-plan
          path: validation-plan.json
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:core-sync
      - run: npm run test:automation
      - run: npm run test:local-time
      - run: npm run test:data-bounded-reads
      - run: npm run test:fleet
      - run: npm run test:desktop
      - run: node --test tests/diagnostics.test.mjs
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/contracts/rust
      - run: python3 scripts/check-contracts.py
      - run: node scripts/check-contracts.mjs
      - run: cargo test --manifest-path packages/contracts/rust/Cargo.toml
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studiolo
          POSTGRES_PASSWORD: studiolo-ci-password
          POSTGRES_DB: studiolo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studiolo -d studiolo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      STUDIOLO_MODE: core
      DATABASE_URL: postgresql+psycopg://studiolo:studiolo-ci-password@127.0.0.1:5432/studiolo
      CORS_ORIGINS: http://localhost:5173
      ALLOW_REGISTRATION: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-postgres.txt
      - run: python -m pip install -r backend/requirements-postgres.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - run: npm ci
        working-directory: agent-adapters/openclaw/plugin
      - run: npm run build
        working-directory: agent-adapters/openclaw/plugin
      - run: npm run plugin:build
        working-directory: agent-adapters/openclaw/plugin
      - run: npm run validate
        working-directory: agent-adapters/openclaw/plugin
      - run: npm test
        working-directory: agent-adapters/openclaw/plugin
      - run: python scripts/export-agent-tools.py --check
      - name: Generate temporary JWT secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: python -m alembic -c alembic.ini upgrade head
        working-directory: backend
      - run: python tests/postgres_smoke.py
        working-directory: backend
      - run: python tests/postgres_upgrade_smoke.py
        working-directory: backend
      - run: python tests/postgres_sync_integration.py
        working-directory: backend
      - run: python tests/postgres_background_sync_integration.py
        working-directory: backend
      - run: python tests/postgres_conflict_integration.py
        working-directory: backend
      - run: python tests/postgres_personal_state_integration.py
        working-directory: backend
      - run: python tests/postgres_automation_integration.py
        working-directory: backend
  device-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: device-client/requirements.txt
      - run: python -m pip install -r device-client/requirements.txt pytest
      - run: python -m compileall device-client
      - run: python -m pytest -q device-client/tests
  openclaw-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent-adapters/openclaw/requirements.txt
      - run: python -m pip install -r agent-adapters/openclaw/requirements.txt
      - run: python -m compileall agent-adapters/openclaw
      - run: python -m pytest -q
        working-directory: agent-adapters/openclaw
  agent-node-and-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            agent-node/requirements.txt
            deploy/edge-relay/requirements.txt
      - run: python -m pip install -r backend/requirements.txt -r agent-node/requirements.txt -r deploy/edge-relay/requirements.txt
      - run: python -m compileall agent-node deploy/edge-relay
      - run: python -m pytest -q tests
        working-directory: agent-node
      - run: python -m pytest -q test_edge_relay.py
        working-directory: deploy/edge-relay
  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: python -m pip install -r backend/requirements.txt 'pyinstaller>=6,<7'
      - run: npm run desktop:build
      - run: python scripts/smoke-backend-sidecar.py
      - name: Verify installer and sidecar
        shell: pwsh
        run: |
          if (-not (Test-Path 'src-tauri/binaries/studiolo-backend-x86_64-pc-windows-msvc.exe')) { throw 'Sidecar missing' }
          $installer = Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis' -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: studiolo-desktop-windows
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
  desktop-macos:
    # Intel x64 与 Apple Silicon 各自在原生 runner 上出包（sidecar 由 PyInstaller 构建，不能交叉编译）
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-latest
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.arch }}
      - run: npm ci
      - run: python -m pip install -r backend/requirements.txt 'pyinstaller>=6,<7'
      - name: Build sidecar and .app
        run: |
          set -euo pipefail
          npm run desktop:prepare
          node node_modules/@tauri-apps/cli/tauri.js build --target "$(rustc --print host-tuple)" --bundles app
      - run: python scripts/smoke-backend-sidecar.py
      - name: Ad-hoc sign and package DMG
        run: |
          set -euo pipefail
          TRIPLE=$(rustc --print host-tuple)
          APP="src-tauri/target/$TRIPLE/release/bundle/macos/Studiolo.app"
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          DMG_DIR="src-tauri/target/$TRIPLE/release/bundle/dmg"
          DMG="$DMG_DIR/Studiolo_${VERSION}_${{ matrix.arch }}.dmg"
          mkdir -p "$DMG_DIR"
          # 先签名再打包：未签名的 .app 塞进 DMG 会被 Gatekeeper 直接判为不可用
          codesign --force --sign - "$APP/Contents/MacOS/studiolo-backend"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          STAGE=$(mktemp -d)
          ditto "$APP" "$STAGE/Studiolo.app"
          ln -s /Applications "$STAGE/Applications"
          if [ -f src-tauri/icons/icon.icns ]; then cp src-tauri/icons/icon.icns "$STAGE/.VolumeIcon.icns"; fi
          hdiutil create -volname Studiolo -srcfolder "$STAGE" -fs HFS+ -format UDZO -ov "$DMG"
          hdiutil verify "$DMG"
          shasum -a 256 "$DMG" | tee "$DMG.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: studiolo-desktop-macos-${{ matrix.arch }}
          path: |
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/dmg/*.sha256
      - name: Attach DMG to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" src-tauri/target/*/release/bundle/dmg/*.dmg --clobber
          else
            echo "No release for $GITHUB_REF_NAME yet — artifact only."
          fi
