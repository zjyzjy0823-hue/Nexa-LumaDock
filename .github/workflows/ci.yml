name: CI
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:core-sync
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexa
          POSTGRES_PASSWORD: nexa-ci-password
          POSTGRES_DB: nexa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexa -d nexa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      NEXA_MODE: core
      DATABASE_URL: postgresql+psycopg://nexa:nexa-ci-password@127.0.0.1:5432/nexa
      CORS_ORIGINS: http://localhost:5173
      ALLOW_REGISTRATION: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-postgres.txt
      - run: python -m pip install -r backend/requirements-postgres.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - run: npm ci
        working-directory: agent-adapters/openclaw/plugin
      - run: npm run build
        working-directory: agent-adapters/openclaw/plugin
      - run: npm run plugin:build
        working-directory: agent-adapters/openclaw/plugin
      - run: npm run validate
        working-directory: agent-adapters/openclaw/plugin
      - run: npm test
        working-directory: agent-adapters/openclaw/plugin
      - run: python scripts/export-agent-tools.py --check
      - name: Generate temporary JWT secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: python -m alembic -c alembic.ini upgrade head
        working-directory: backend
      - run: python tests/postgres_smoke.py
        working-directory: backend
      - run: python tests/postgres_upgrade_smoke.py
        working-directory: backend
      - run: python tests/postgres_sync_integration.py
        working-directory: backend
      - run: python tests/postgres_background_sync_integration.py
        working-directory: backend
  device-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: device-client/requirements.txt
      - run: python -m pip install -r device-client/requirements.txt pytest
      - run: python -m compileall device-client
      - run: python -m pytest -q device-client/tests
  openclaw-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent-adapters/openclaw/requirements.txt
      - run: python -m pip install -r agent-adapters/openclaw/requirements.txt
      - run: python -m compileall agent-adapters/openclaw
      - run: python -m pytest -q
        working-directory: agent-adapters/openclaw
  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: python -m pip install -r backend/requirements.txt 'pyinstaller>=6,<7'
      - run: npm run desktop:build
      - run: python scripts/smoke-backend-sidecar.py
      - name: Verify installer and sidecar
        shell: pwsh
        run: |
          if (-not (Test-Path 'src-tauri/binaries/nexa-backend-x86_64-pc-windows-msvc.exe')) { throw 'Sidecar missing' }
          $installer = Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis' -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: nexa-desktop-windows
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
