name: Android
on: [push, pull_request, workflow_dispatch]

jobs:
  rust-local-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/crates/studiolo-local-core
      - run: cargo test --locked --manifest-path src-tauri/crates/studiolo-local-core/Cargo.toml
      - name: Install Linux Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'

  android-apk:
    runs-on: ubuntu-latest
    env:
      STUDIOLO_NDK_VERSION: '28.2.13676358'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install pinned Android build tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;$STUDIOLO_NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$STUDIOLO_NDK_VERSION" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run android:prepare
      - run: npx tauri android build --apk --target aarch64 --debug
      - uses: actions/upload-artifact@v4
        with:
          name: studiolo-android-arm64-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
