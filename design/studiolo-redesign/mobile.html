<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studiolo · 手机端设计原型</title>
  <link rel="stylesheet" href="studiolo.css">
  <link rel="stylesheet" href="mobile.css">
</head>
<body class="mob">
  <header class="proto-bar" id="proto"></header>
  <div class="mstage">
    <div class="phone">
      <div class="screen" id="screen">
        <div class="glass-wallpaper" aria-hidden="true"></div>
        <div class="os-bar" aria-hidden="true"><span>21:48</span><span class="cam"></span><span class="ic" id="os-ic"></span></div>
        <div class="mview" id="view"></div>
        <nav class="tabbar" id="tabbar" aria-label="主导航"></nav>
        <div class="home-ind" aria-hidden="true"></div>
        <div class="scrim" id="scrim"></div>
        <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></section>
        <div class="toast-host mtoast" id="toasts"></div>
      </div>
    </div>
    <aside class="notes" id="notes"></aside>
  </div>
  <script src="shared.js"></script>
  <script src="mobile.js"></script>
</body>
</html>
